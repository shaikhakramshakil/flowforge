server:
  port: 8080

spring:
  application:
    name: flowforge
  datasource:
    url: ${FF_DB_URL:jdbc:postgresql://localhost:5432/flowforge}
    username: ${FF_DB_USER:flowforge}
    password: ${FF_DB_PASSWORD:flowforge}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: flowforge
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

flowforge:
  scheduler:
    # Kill-switch for the background sweep (tests / passive instances).
    enabled: true
    # Fixed delay for the @Scheduled sweep (plain millis).
    scan-interval-ms: 1000
    # Max tasks fetched per scan pass.
    batch-size: 100
    # Lease granted to a worker when it claims a task for execution.
    lease-duration: 30s
    # Silence threshold before a worker reads UNHEALTHY. Independent of the
    # task lease: heartbeats and leases fail at different rates.
    worker-timeout: 90s
  worker:
    # Set false for a pure server; true embeds one simulated worker in this
    # process for demos and local testing without extra containers.
    enabled: true
    id: demo-worker
    hostname: localhost
    cpu-capacity: 4
    memory-capacity-mb: 8192
    heartbeat-interval: 2s
    server-url: http://localhost:8080
  retry:
    # Initial backoff before retry 1 (base * factor^attempt).
    initial-backoff: 2s
    max-backoff: 60s
    # Default max attempts when a workflow task omits `maxAttempts`.
    default-max-attempts: 3

logging:
  pattern:
    console: "%d{ISO8601} [%thread] %-5level [%X{requestId}] %logger{36} - %msg%n"